name: Build site data

# Upload or edit CSVs under data/ and this regenerates the *-data.js files the
# site loads, then commits them back to main. GitHub Pages redeploys from that
# commit, so the live atlas updates on its own.

on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate data files
        run: python3 tools/build_data.py

      - name: Commit regenerated data
        run: |
          if git diff --quiet -- '*-data.js'; then
            echo "Data files already up to date - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-data.js'
          git commit -m "Rebuild site data from data/ CSVs"
          git push
