name: Deploy to EECS Vhosts

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/w/ignite/"
          EXCLUDE: "/.git/, /.github/"
          SCRIPT_AFTER: |
            find /w/ignite -type d -exec chmod 755 {} +
            find /w/ignite -type f -exec chmod 644 {} +
